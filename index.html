<!DOCTYPE html>
<!--
  link.vagozi.com's home page. The site exists for the invite links (404.html
  is their fallback page) and the app-link files in .well-known/; this page
  only points to vagozi.com. Static, nothing from another origin.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Vagozi</title>
    <style>
      /* The app's colours. */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #f6f7f9;
        color: #0e1b3d;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        font-size: 17px;
        line-height: 1.5;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        background: #ffffff;
        border: 1px solid #e3e7ee;
        border-radius: 20px;
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        color: #1c4fc0;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.5px;
      }
      p {
        margin: 0;
        color: #5b6478;
        font-size: 15px;
      }
      .button {
        display: block;
        margin-top: 24px;
        padding: 14px 20px;
        border-radius: 14px;
        background: #1c4fc0;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vagozi</h1>
      <p>Links here open trip invites in the Vagozi app.</p>
      <a class="button" href="https://vagozi.com">Go to vagozi.com</a>
    </main>
  </body>
</html>
